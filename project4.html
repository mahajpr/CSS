<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Project4</title>
</head>
<style>
body{
    display:flex;
    justify-content:center;
    margin-top:30px;
}
.container{
    background-color: rgb(119, 15, 119);
    max-width:600px;
    border-radius: 8px;
    display:flex;
    gap:20px;
    padding:20px;
    justify-content: center;
    margin:auto;
}
.container a {
    color:white;
    border-radius:5px;
    padding:10px 15px;
    text-decoration: none;
}
.container a:hover{
    background-color:rgb(155, 74, 155);
    transition:0.3s;
}

</style>
<body>
    <div class="container">
        <a href="#logo">Logo</a>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
    </div>
</body>
</html>
