<style>
    .grid-box1{
        display:grid;
        grid-template-columns: 100px 100px 100px;
        background-color: rgb(184, 183, 183);
        height:400px;
        width:700px;
        margin:100px;
        border:3px solid black;
        gap:10px 50px;
        justify-content:center;
        align-content:center;

    }
    .grid-box1 div img{
        background-color: white;
        width:100px;
        height:100px;
        padding:10px;
    }
    #grid-box2{
        display:grid;
        grid-template-columns:100px 100px 100px;
        background-color:rgb(184, 183, 183); 
        padding:5px;
        border:2px solid black;
        gap:5px;
        justify-content: space-evenly;
        align-content:space-evenly;
    }
    #grid-box2 div img{
        background-color:white;
        width:100px;
        height:100px;
        padding:10px;
    }
    #grid-item{
        display: grid;
        grid-template-columns:100px 100px 100px;
        background-color:rgb(184, 183, 183);
        padding:5px;
        border:2px solid black;
        gap:5px;
        justify-content: center;
        align-content: center;
        margin-top:50px;
    
    }
    #grid-item div img{
        background-color: white;
        width: 100px;
        height:100px;
        padding:10px;
    }
    .item-1{
        grid-column:1 / span 2;
        grid-row:1 / span 2;
    }
</style>
