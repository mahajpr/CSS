<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Project 3</title>
</head>
<style>
    body{
        background-color:rgba(31, 31, 155, 0.945);
        display:flex;
        justify-content: center;
        align-items: center;
        min-height:100vh;
    }
    .container {
        color:rgba(31, 31, 155, 0.945);
        border:2px solid white;
        margin:20px;
        padding:20px;
        background-color: white;
    }
    .container h1{
        background-color: rgba(31, 31, 155, 0.945);
        color:white;
        margin:10px;
        padding:10px;
        border-radius:6px;
    }
    .card-group img{
        width:100%;
        max-width:300px;
        border-radius:10px;
    }
    .card-group h2{
        text-align: center;
    }
    .card-group input{
        width:200px;
        padding:12px;
        border-radius:15px;
        cursor:pointer;
        color:rgba(31, 31, 155, 0.945);
        background-color: white;
        border:2px solid rgba(141, 141, 201, 0.945);
    }
    .card-group input:hover{
        background-color: rgba(141, 141, 201, 0.945);
        transition:0.3s;
    }

</style>
<body>
    <div class="container">
        <h1>Product card design</h1>
        <div class="card-group">
            <h2>SHOES</h2>
            <img src="https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=500&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8c2hvZXN8ZW58MHx8MHx8fDA%3D" alt="shoe img">
            <p>Product : Nike Shoes</p>
            <p>Price : $120</p>
            <input type="submit" value="Add to Cart">
        </div>
    </div>
</body>
</html>
